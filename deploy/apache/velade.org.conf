# velade.org — static site served by Apache on the Debian VM.
#
# Traffic path: Internet → Nginx Proxy Manager Plus (TLS) → this server (HTTP :80).
# Install to /etc/apache2/sites-available/velade.org.conf and enable with
# `a2ensite velade.org`. Requires: a2enmod headers rewrite. See docs/deployment.md.
#
# Name-based virtual hosts: other sites already served by this Apache keep
# working; these two blocks only answer requests for velade.org / www.velade.org.

# www.velade.org → velade.org (one canonical host). Apache labels its built-in
# redirect page ISO-8859-1; the page is plain ASCII, so say UTF-8 like the site.
<VirtualHost *:80>
    ServerName www.velade.org
    Redirect permanent / https://velade.org/
    Header always set Content-Type "text/html; charset=utf-8"
</VirtualHost>

<VirtualHost *:80>
    # TLS ends at the proxy, so Apache only sees plain HTTP. Declaring the public
    # scheme here makes Apache's own redirects (e.g. /blog → /blog/) point to
    # https://velade.org instead of http://.
    ServerName https://velade.org
    UseCanonicalName On

    # Each deploy is a directory under releases/; "current" points to the live one.
    DocumentRoot /var/www/velade.org/current

    <Directory /var/www/velade.org>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    DirectoryIndex index.html
    AddDefaultCharset utf-8
    AddType image/avif .avif
    AddType image/svg+xml .svg
    AddType font/woff2 .woff2
    <Files "rss.xml">
        ForceType "application/rss+xml; charset=utf-8"
    </Files>

    ErrorDocument 404 /404.html

    RewriteEngine On
    # The 404 page is only served as an error response, never directly.
    RewriteCond %{ENV:REDIRECT_STATUS} ^$
    RewriteRule ^/404\.html$ - [R=404,L]
    # Never serve dotfiles.
    RewriteRule (^|/)\. - [R=404,L]

    # Every request arrives from the proxy; take the visitor's address from the
    # header it sets, trusted only when it comes from the proxy itself.
    # Requires `a2enmod remoteip`; replace the address if the proxy moves.
    <IfModule mod_remoteip.c>
        RemoteIPHeader X-Real-IP
        RemoteIPInternalProxy 192.168.1.102
    </IfModule>

    # Compression (Brotli, zstd, gzip) is done by the proxy, which asks this
    # server for uncompressed responses. Turning mod_deflate off here keeps it
    # from adding a second "Vary: Accept-Encoding" to the proxy's own.
    SetEnv no-gzip 1

    # Security headers (Strict-Transport-Security is set by the proxy).
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), browsing-topics=()"
    Header always set Cross-Origin-Opener-Policy "same-origin"
    Header always unset X-Powered-By

    # Caching. Pages are revalidated on every visit (cheap 304s via ETag), so a
    # new deploy is visible immediately.
    Header always set Cache-Control "no-cache"

    # Fixed-name files: favicons, the social preview image.
    <FilesMatch "\.(png|jpe?g|webp|avif|svg|ico|woff2)$">
        Header always set Cache-Control "public, max-age=604800"
    </FilesMatch>

    # Feed, sitemaps, robots.txt: short cache so new entries show up quickly.
    <FilesMatch "\.(xml|txt)$">
        Header always set Cache-Control "public, max-age=3600"
    </FilesMatch>

    # Fingerprinted build output (file names change when content changes).
    <LocationMatch "^/_astro/">
        Header always set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>

    ErrorLog ${APACHE_LOG_DIR}/velade.org-error.log
    # "combined" with %a instead of %h: %h stays the proxy's address even with
    # mod_remoteip, %a is the visitor's.
    CustomLog ${APACHE_LOG_DIR}/velade.org-access.log "%a %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\""
</VirtualHost>
