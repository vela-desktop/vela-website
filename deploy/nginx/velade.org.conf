# velade.org — static site served by Nginx on the Debian VM.
#
# Traffic path: Internet → Nginx Proxy Manager Plus (TLS) → this server (HTTP).
# Install to /etc/nginx/sites-available/velade.org and enable with a symlink in
# /etc/nginx/sites-enabled/. Requires the header snippet in
# /etc/nginx/snippets/velade-headers.conf. See docs/deployment.md.

# www.velade.org → velade.org (one canonical host).
server {
    listen 80;
    listen [::]:80;
    server_name www.velade.org;

    server_tokens off;
    return 301 https://velade.org$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name velade.org;

    # Each deploy is a directory under releases/; "current" points to the live one.
    root /var/www/velade.org/current;
    index index.html;
    charset utf-8;

    server_tokens off;

    # TLS ends at the proxy, so this server only sees http://<vm>:80. Relative
    # redirects keep the browser on https://velade.org (e.g. /blog → /blog/).
    absolute_redirect off;

    # Log the visitor's address instead of the proxy's. Replace the placeholder
    # with the address of the Nginx Proxy Manager Plus host, then uncomment.
    # set_real_ip_from <NPM_PROXY_IP>;
    # real_ip_header X-Real-IP;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css text/plain text/xml application/xml application/rss+xml
               application/javascript application/json image/svg+xml;

    error_page 404 /404.html;

    # Fingerprinted build output (file names change when content changes).
    location ^~ /_astro/ {
        include snippets/velade-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # Fixed-name files: favicons, the social preview image.
    location ~* \.(?:png|jpe?g|webp|avif|svg|ico|woff2)$ {
        include snippets/velade-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
        try_files $uri =404;
    }

    # Feed, sitemaps, robots.txt: short cache so new entries show up quickly.
    location = /rss.xml {
        include snippets/velade-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        types { }
        default_type "application/rss+xml; charset=utf-8";
        try_files $uri =404;
    }

    location ~* \.(?:xml|txt)$ {
        include snippets/velade-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # The 404 page: only served as an error response.
    location = /404.html {
        include snippets/velade-headers.conf;
        add_header Cache-Control "no-cache" always;
        internal;
    }

    # Never serve dotfiles.
    location ~ /\. {
        deny all;
        return 404;
    }

    # Pages: /path/ → /path/index.html. HTML is revalidated on every visit
    # (cheap 304s via ETag), so a new deploy is visible immediately.
    location / {
        include snippets/velade-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}
