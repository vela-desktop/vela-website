# Security headers for velade.org — install to /etc/nginx/snippets/velade-headers.conf.
#
# Included in every location of velade.org.conf, because a location that sets
# its own add_header (Cache-Control) no longer inherits the server's headers.
# Strict-Transport-Security is set by Nginx Proxy Manager Plus, which terminates TLS.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), browsing-topics=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
